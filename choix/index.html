<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On mange où ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff3dc; --card:#ffffff; --ink:#151515; --soft:#5d5a55;
    --sun:#ffd23f; --orange:#ff7a3d; --teal:#2ec4b6; --blue:#4d7cfe;
    --line:3px solid var(--ink); --shadow:5px 5px 0 var(--ink);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(rgba(21,21,21,.13) 1.2px,transparent 1.2px);
    background-size:22px 22px;
    min-height:100vh;display:flex;padding:24px 20px 48px;
  }
  .sticker{position:fixed;pointer-events:none;font-size:30px;opacity:.9;animation:float 7s ease-in-out infinite;z-index:0}
  @keyframes float{50%{transform:translateY(-14px) rotate(var(--r,8deg))}}
  .card{
    position:relative;z-index:1;width:min(460px,100%);margin:auto;background:var(--card);
    border:var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--ink);
    padding:28px 24px 24px;text-align:center;
  }
  .screen{display:none;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  .screen.on{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(25px,6.2vw,31px);line-height:1.1;margin:8px 0 6px;letter-spacing:-.01em}
  h1 .hl{background:var(--sun);padding:0 6px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sub{color:var(--soft);margin:0 0 20px;font-size:15px}
  .big-emoji{display:inline-grid;place-items:center;width:78px;height:78px;font-size:42px;line-height:1;
             background:var(--sun);border:var(--line);border-radius:50%;box-shadow:var(--shadow);margin-bottom:4px;
             animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}
  .opt{display:block;text-align:left;border:var(--line);border-radius:16px;padding:13px 15px;margin:11px 0;
       background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s}
  .opt:hover{background:#fffbea}
  .opt.sel{background:var(--sun);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
  .opt .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px}
  .opt .tag{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px}
  .opt .loc{font-size:12.5px;color:var(--soft);font-weight:600}
  .opt .pitch{font-size:13.5px;margin-top:3px;line-height:1.4}
  .opt .note{font-size:11.5px;color:#c0531f;margin-top:4px}
  .subs{display:none;gap:8px;flex-wrap:wrap;margin-top:10px}
  .opt.sel .subs{display:flex}
  .subchip{font-size:13px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
  .subchip.sel{background:var(--orange);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .site{display:inline-block;margin-top:9px;margin-right:16px;font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:2px}
  button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);border:var(--line)}
  textarea{width:100%;font:inherit;color:var(--ink);padding:12px 14px;border-radius:12px;border:var(--line);
           background:#fff;outline:none;box-shadow:3px 3px 0 var(--ink);resize:vertical;min-height:70px;margin-top:6px}
  textarea:focus{background:#fffbea}
  .go{margin-top:20px;width:100%;background:var(--sun);padding:14px 16px;font-size:17px;border-radius:14px;box-shadow:var(--shadow);
      font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
  .go:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
  .go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .go:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}
  .err{color:#d6401b;font-weight:700;font-size:13px;min-height:1.1em;margin-top:9px}
  .status{font-weight:700;font-size:15px;padding:10px 14px;border:var(--line);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);display:inline-block}
  .status.ok{background:var(--teal)} .status.ko{background:#ffd6c9}
  .recap{background:#fffbea;border:var(--line);border-radius:16px;padding:14px 16px;margin:8px 0 6px;box-shadow:3px 3px 0 var(--ink);font-size:15px;line-height:1.6}
  .foot{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--soft)}
  .confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:20;pointer-events:none;border:2px solid var(--ink);animation:conf 2.4s ease-in forwards}
  @keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="card">
  <section class="screen on" id="s1">
    <div class="big-emoji">🍝</div>
    <h1>On mange <span class="hl">où</span> ?</h1>
    <p class="sub">Voici une petite présélection (pizza/pâtes, cool avec Izïa). À toi de trancher 👇</p>
    <div id="opts"></div>
    <textarea id="comment" maxlength="300" placeholder="Tu préfères un autre resto ? Je te laisse proposer"></textarea>
    <div class="err" id="err"></div>
    <button class="go" id="send">C'est parti ! 🚀</button>
  </section>
  <section class="screen" id="s2">
    <div class="big-emoji">🤙</div>
    <h1>Noté !</h1>
    <div class="recap" id="recap"></div>
    <div class="status" id="status">Envoi…</div>
    <button class="go" id="retry" style="display:none">Réessayer l'envoi</button>
  </section>
</div>
<div class="foot">fait avec beaucoup trop de temps libre ✌️</div>
<script>
(function(){
  function _d(x){try{return decodeURIComponent(escape(atob(x)))}catch(e){return ""}}
  var NTFY_TOPIC=_d("c29ydGllLTE5MDM0MjA5Njk4ZQ==");
  var SHEET_URL=_d("aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J5TzAxc1RuSDNfbXlKODNSQlF1R1phdHBzM0VtcE04TUppWExteUk3ZVBpYjlzMDNBaEFwWFBBZlZNS2NXbHptaEIvZXhlYw==");
  var guest=_d("RG91bmlh"), SESSION=Math.random().toString(36).slice(2,8), T0=Date.now();
  var $=function(id){return document.getElementById(id)};

  // ---- suivi (identique au site principal), taggé "Choix resto" ----
  var devicePromise=null;
  function deviceInfo(){
    if(devicePromise) return devicePromise;
    var ua=navigator.userAgent||"";
    function browser(){
      if(/SamsungBrowser/.test(ua)) return "Samsung Internet";
      if(/MiuiBrowser|XiaoMi/.test(ua)) return "Navigateur Xiaomi";
      if(/EdgA?\//.test(ua)) return "Edge";
      if(/OPR\/|Opera/.test(ua)) return "Opera";
      if(/FxiOS|Firefox/.test(ua)) return "Firefox";
      if(/CriOS|Chrome/.test(ua)) return "Chrome";
      if(/Instagram/.test(ua)) return "Instagram";
      if(/Safari/.test(ua)) return "Safari";
      return "navigateur inconnu";
    }
    function guess(){
      if(/iPhone/.test(ua)) return "iPhone";
      if(/iPad/.test(ua)) return "iPad";
      var m=ua.match(/; ([^;)]+?) Build\//) || ua.match(/Android [\d.]+; ([^;)]+)\)/);
      if(m && m[1]!=="K") return m[1].replace(/ Build.*$/,"");
      if(/Android/.test(ua)) return "Android (modèle masqué)";
      if(/Macintosh/.test(ua)) return (navigator.maxTouchPoints>1?"iPad":"Mac");
      if(/Windows/.test(ua)) return "PC Windows";
      return "appareil inconnu";
    }
    devicePromise=new Promise(function(resolve){
      var done=function(model){ resolve((model||guess())+" · "+browser()); };
      try{
        if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
          var t=setTimeout(function(){done("")},1500);
          navigator.userAgentData.getHighEntropyValues(["model"]).then(function(v){
            clearTimeout(t); done(v && v.model ? v.model : "");
          },function(){ clearTimeout(t); done(""); });
          return;
        }
      }catch(e){}
      done("");
    });
    return devicePromise;
  }
  function sourceOuverture(){
    var ua=navigator.userAgent||"";
    if(/Instagram/i.test(ua)) return "Instagram";
    if(/FBAN|FBAV|FB_IAB/i.test(ua)) return "Facebook";
    if(/WhatsApp/i.test(ua)) return "WhatsApp";
    if(/Snapchat/i.test(ua)) return "Snapchat";
    if(/Messenger/i.test(ua)) return "Messenger";
    try{ if(document.referrer){ return new URL(document.referrer).hostname.replace(/^www\./,""); } }catch(e){}
    return "direct";
  }
  function envInfo(){
    var o={}, c=(navigator.connection||{});
    try{ var medium=c.type||"", speed=c.effectiveType||"";
         o["Connexion"]=(medium?medium:(speed?"≈"+speed:""))+(c.downlink?(" ~"+c.downlink+"Mbps"):""); }catch(e){}
    return o;
  }
  function logStep(ev,x){
    x=x||{};
    var snap={detail:x.detail||"",commentaire:x.commentaire||"",temps:Math.round((Date.now()-T0)/1000),src:sourceOuverture()};
    deviceInfo().then(function(dev){
      var parts=(dev||"").split(" · ");
      var body={
        "Page":"Choix resto","Session":SESSION,"Événement":ev,"Invité":guest,
        "Temps (s)":snap.temps,"Détail":snap.detail,"Commentaire":snap.commentaire,
        "Appareil":parts[0]||"","Navigateur":parts[1]||"","Source":snap.src
      };
      var E=envInfo(); for(var _k in E){ body[_k]=E[_k]; }
      try{ fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).catch(function(){}); }catch(e){}
    });
  }
  function beaconLog(ev,extra){
    try{
      extra=extra||{};
      try{ if(localStorage.getItem("pasDalerte")==="1") return; }catch(e){}
      var parts=(DEV||"").split(" · ");
      var body={"Page":PAGE,"Session":SESSION,"Événement":ev,"Invité":guest,"Temps (s)":Math.round((Date.now()-T0)/1000),"Détail":extra.detail||"","Appareil":parts[0]||"","Navigateur":parts[1]||"","Source":sourceOuverture()}; var E=envInfo(); for(var _k in E){ body[_k]=E[_k]; }
      var payload=JSON.stringify(body);
      if(navigator.sendBeacon){ navigator.sendBeacon(SHEET_URL, new Blob([payload],{type:"text/plain;charset=utf-8"})); }
      else { fetch(SHEET_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload}).catch(function(){}); }
    }catch(e){}
  }
  // Alerte à l'ouverture (une fois par session) ; #moi la désactive sur cet appareil
  (function(){
    try{
      if(location.hash==="#moi"){ localStorage.setItem("pasDalerte","1"); history.replaceState(null,"",location.pathname); }
      if(localStorage.getItem("pasDalerte")==="1") return;
      if(sessionStorage.getItem("ouvertureChoix")==="1") return;
      sessionStorage.setItem("ouvertureChoix","1");
    }catch(e){}
    deviceInfo().then(function(dev){
      try{ fetch("https://ntfy.sh/"+NTFY_TOPIC+"?title="+encodeURIComponent("👀 "+guest+" a ouvert la page des restos")+"&tags=eyes",{method:"POST",body:"📱 "+dev}).catch(function(){}); }catch(e){}
      DEV=dev; logStep("ouverture");
    });
  })();
  // Retour sur la page (chaque retour)
  (function(){
    try{ if(localStorage.getItem("pasDalerte")==="1") return; }catch(e){}
    var hiddenAt=0;
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="hidden"){ hiddenAt=Date.now(); beaconLog("quitte la page"); }
      else if(document.visibilityState==="visible" && hiddenAt){
        var away=Math.round((Date.now()-hiddenAt)/1000); hiddenAt=0;
        logStep("retour sur la page",{detail:"absente "+away+" s"});
      }
    });
  })();

  [["🧱","6%","90%"],["🧱","72%","4%"],["🍕","6%","12%"],["🎬","88%","10%"],["🍝","90%","72%"],["⭐","4%","78%"]]
  .forEach(function(s,i){var el=document.createElement("div");el.className="sticker";el.textContent=s[0];
    el.style.left=s[1];el.style.top=s[2];el.style.animationDelay=(-i*1.3)+"s";el.style.setProperty("--r",(i%2?-10:10)+"deg");document.body.appendChild(el);});

  var PICKS=[
    {nom:"Come Prima",loc:"Lille · bd de la Liberté",tag:"⭐ Le meilleur",pitch:"Le mieux noté du coin, pizzas et pâtes qui font l'unanimité.",site:"https://comeprimalille.com/"},
    {nom:"Little Italy",loc:"Lille ou Saint-André – au choix",tag:"🍕 Team pizza",pitch:"Pizza napolitaine bien notée, ambiance cosy.",sub:["Lille","Saint-André"],site:"https://littleitaly-lille.fr/fr",siteSA:"https://littleitaly-saintandrelezlille.fr/fr"},
    {nom:"La Nonna",loc:"Roubaix · Grande Rue",tag:"🍝 Top pâtes",pitch:"Réputé pour ses pâtes et ses lasagnes, ambiance familiale.",note:"Sans alcool",site:"https://lanonna-ristorante.fr/"},
    {nom:"Rosso & Bianco",loc:"Villeneuve d'Ascq · Paul Doumer",tag:"🧘 Le plus calme",pitch:"Donné comme le plus tranquille, ambiance posée.",site:"https://www.rossobianco.fr/"},
    {nom:"La Bellezza",loc:"Lille · Esquermoise",tag:"✨ Le plus couru",pitch:"Pâtes à la truffe et pizzas, cadre canon — mais ça bouge pas mal, peut-être relou avec Izïa.",site:"https://www.bigmammagroup.com/fr/restaurants-italiens/la-bellezza-lille"}
  ];
  var choix="", subloc="";
  var box=$("opts");
  PICKS.forEach(function(p){
    var el=document.createElement("div"); el.className="opt"; el.dataset.nom=p.nom;
    if(p.site) el.dataset.site=p.site;
    if(p.siteSA) el.dataset.sitesa=p.siteSA;
    var h='<div class="top"><span class="name">'+p.nom+'</span><span class="tag">'+p.tag+'</span></div>';
    if(p.loc) h+='<div class="loc">📍 '+p.loc+'</div>';
    h+='<div class="pitch">'+p.pitch+'</div>';
    if(p.note) h+='<div class="note">⚠️ '+p.note+'</div>';
    if(p.sub){ h+='<div class="subs">'+p.sub.map(function(x){return '<span class="subchip" data-sub="'+x+'">'+x+'</span>'}).join('')+'</div>'; }
    if(p.siteSA){
      h+='<a class="site" href="'+p.site+'" target="_blank" rel="noopener">🔗 Site de Lille ↗</a>';
      h+='<a class="site" href="'+p.siteSA+'" target="_blank" rel="noopener">🔗 Site de Saint-André ↗</a>';
    } else if(p.site){ h+='<a class="site" href="'+p.site+'" target="_blank" rel="noopener">🔗 Voir le site ↗</a>'; }
    el.innerHTML=h; box.appendChild(el);
  });
  box.addEventListener("click",function(e){
    var _sl=e.target.closest(".site");
    if(_sl){
      var _c=_sl.closest(".opt"), _n=_c?_c.dataset.nom:"";
      var _loc=/Lille/.test(_sl.textContent)?" (Lille)":(/Saint-André/.test(_sl.textContent)?" (Saint-André)":"");
      logStep("clic site",{detail:_n+_loc});
      return; // laisser le lien s'ouvrir
    }
    var sc=e.target.closest(".subchip");
    if(sc){ e.stopPropagation();
      sc.parentNode.querySelectorAll(".subchip").forEach(function(c){c.classList.remove("sel")});
      sc.classList.add("sel"); subloc=sc.dataset.sub; $("err").textContent=""; logStep("sous-choix",{detail:subloc}); return; }
    var o=e.target.closest(".opt"); if(!o) return;
    if(o.dataset.nom!==choix){ subloc=""; o.querySelectorAll(".subchip").forEach(function(c){c.classList.remove("sel")}); }
    box.querySelectorAll(".opt").forEach(function(c){c.classList.remove("sel")});
    o.classList.add("sel"); choix=o.dataset.nom; $("err").textContent=""; logStep("resto sélectionné",{detail:choix});
  });

  function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on");window.scrollTo(0,0);}
  function confetti(){var c=["#ffd23f","#ff7a3d","#2ec4b6","#4d7cfe","#fff"];for(var i=0;i<60;i++){var d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDelay=Math.random()*.6+"s";d.style.borderRadius=Math.random()>.5?"50%":"2px";document.body.appendChild(d);setTimeout(function(el){return function(){el.remove()}}(d),3200);}}

  var message="";
  function envoyer(){
    var st=$("status"); st.className="status"; st.textContent="Envoi…"; $("retry").style.display="none";
    var com=$("comment").value.trim();
    var ctrl=("AbortController" in window)?new AbortController():null;
    var t=setTimeout(function(){if(ctrl)ctrl.abort()},10000);
    // Google Sheet (log)
    logStep("choix resto",{detail:choixFinal,commentaire:com});
    // ntfy (notif) enrichie de l'appareil
    deviceInfo().then(function(dev){
      message="🍝 "+guest+" a choisi : "+choixFinal+(com?"\n\n💬 "+com:"")+"\n\n📱 "+dev;
      return fetch("https://ntfy.sh/"+NTFY_TOPIC+"?title="+encodeURIComponent("🍝 "+guest+" a choisi le resto")+"&tags=fork_and_knife&priority=high",
        {method:"POST",body:message,signal:ctrl?ctrl.signal:undefined});
    })
    .then(function(r){clearTimeout(t); if(!r.ok) throw 0; st.className="status ok"; st.textContent="C'est noté ✅";})
    .catch(function(){clearTimeout(t); st.className="status ko"; st.textContent="Oups, l'envoi a raté 😬"; $("retry").style.display="block";});
  }
  $("retry").addEventListener("click",envoyer);

  var choixFinal="";
  $("send").addEventListener("click",function(){
    if(!choix){ $("err").textContent="Choisis un resto 👀"; logStep("erreur",{detail:"aucun resto"}); return; }
    if(choix==="Little Italy" && !subloc){ $("err").textContent="Little Italy : Lille ou Saint-André ?"; logStep("erreur",{detail:"Little Italy sans ville"}); return; }
    choixFinal = (choix==="Little Italy") ? "Little Italy ("+subloc+")" : choix;
    var com=$("comment").value.trim();
    $("recap").innerHTML="🍴 <b>"+choixFinal+"</b>"+(com?"<br>💬 "+com.replace(/[&<>]/g,""):"");
    confetti(); show("s2"); envoyer();
  });
})();
</script>
</body>
</html>
